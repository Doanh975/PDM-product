# Employee Attendance & Shift Scheduling - configuration template
#
# On first start the app copies this file to config.properties (ignored by git).
# Change your own connection in config.properties or with "Database settings"
# on the sign-in screen. Do not put real passwords in this file.

# Database connection
db.url=jdbc:mysql://localhost:3306/employee_attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&connectTimeout=5000
db.user=root
db.password=

# Login
# The sample data stores placeholder strings in UserAccount.PasswordHash (not real
# bcrypt hashes). When true, an account whose hash is NOT a valid bcrypt hash
# accepts any non-empty password (demo only). Accounts with a real bcrypt hash
# are always verified properly. Set to false once real passwords are set.
auth.allowPlaceholderHash=true

# Business settings
# Reference "today" used for default query parameters (Q1-Q5). Leave empty to use
# the real current date. 2026-11-19 matches the dates used in the final report.
app.referenceDate=2026-11-19

# How many days an approved leave deducts from LeaveBalance.UsedDays:
#   CALENDAR = every day from StartDate to EndDate inclusive (matches 02_queries_and_updates.sql)
#   WORKING  = skip Saturdays, Sundays and paid PublicHoliday dates
leave.dayCountMode=CALENDAR
